# Learning curve + parameter-efficient vs expert-only adaptation.
#
#   evla sweep -c configs/sweep_learning_curve.yaml --out results/pusht_learning_curve
#
# One row per checkpoint, all evaluated on the same 20 seeds at the same execution
# strategy (open loop, 50 actions per plan), so the only thing that changes is how
# much fine-tuning the policy received.
#
# The LoRA comparison lives in results/pusht_lora/ instead of here: those checkpoints
# need the adapter merged into the base model first (scripts/merge_lora_adapter.py),
# and mixing a different trainable-parameter budget into one curve would suggest a
# continuity that does not exist.

title: "Push-T: success rate vs amount of fine-tuning"

policy:
  type: smolvla
  device: cuda
  image_key: top
  precision: bf16

env:
  name: pusht
  max_steps: 300

eval:
  episodes: 20
  seed0: 0
  mode: open_loop
  execute_steps: 50

reference: base__zeroshot

sweep:
  - label: base__zeroshot
    checkpoint: checkpoints/smolvla_base

  - label: expertonly__4k
    checkpoint: outputs/smolvla_pusht_20k/checkpoints/004000/pretrained_model

  - label: expertonly__8k
    checkpoint: outputs/smolvla_pusht_20k/checkpoints/008000/pretrained_model

  - label: expertonly__12k
    checkpoint: outputs/smolvla_pusht_20k/checkpoints/012000/pretrained_model

  - label: expertonly__16k
    checkpoint: outputs/smolvla_pusht_20k/checkpoints/016000/pretrained_model

  - label: expertonly__20k
    checkpoint: outputs/smolvla_pusht_20k/checkpoints/020000/pretrained_model
