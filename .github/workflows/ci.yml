name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU torch + package
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Unit + integration tests
        run: pytest tests -q

  quickstart:
    # Proves the full pipeline (collect -> train -> evaluate -> report) runs from a
    # clean checkout on CPU, in about a minute, without a GPU or a robot.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: End-to-end toy pipeline
        run: |
          evla quickstart --out /tmp/quickstart --episodes 40 --steps 300 --eval-episodes 6
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: quickstart-report
          path: /tmp/quickstart/eval
